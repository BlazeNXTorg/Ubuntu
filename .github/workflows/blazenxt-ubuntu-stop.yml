name: BlazeNXT Ubuntu STOP

# Kill switch: force-cancels running sessions and disables the 6-hourly cron.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type STOP to force-cancel every running BlazeNXT Ubuntu session'
        required: true
        default: "STOP"
      disable_schedule:
        description: "Also disable the 6-hourly cron (recommended - otherwise a session restarts within 6 h)"
        type: boolean
        required: true
        default: true

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'STOP' }}
    steps:
      - name: Force-cancel running and queued sessions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Looking for live BlazeNXT Ubuntu sessions..."
          found=0
          for status in in_progress queued requested waiting pending; do
            ids=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/blazenxt-ubuntu.yml/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null || true)
            for id in $ids; do
              [ -z "$id" ] && continue
              found=1
              echo "  force-cancelling run $id ($status)"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" >/dev/null || echo "    (already finished)"
            done
          done
          [ "$found" -eq 0 ] && echo "No live sessions found."

      - name: Disable the 6-hourly cron
        if: ${{ github.event.inputs.disable_schedule == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/blazenxt-ubuntu.yml/disable" >/dev/null \
            && echo "Schedule disabled - no new sessions will start."
          gh workflow list --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          {
            echo "## Ubuntu workstation stopped"
            echo ""
            echo "| Action | State |"
            echo "|---|---|"
            echo "| Live sessions | force-cancelled |"
            echo "| 6-hourly cron | ${{ github.event.inputs.disable_schedule == 'true' && 'DISABLED' || 'still enabled' }} |"
            echo ""
            echo "Restart: Actions -> *BlazeNXT Ubuntu Workstation* -> **Enable workflow**,"
            echo "then **Run workflow** or wait for the next cron tick."
          } >> "$GITHUB_STEP_SUMMARY"
